<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ORİMAK Fuar CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: mobile-first app shell — sticky header, pipeline strip, lead list, bottom sheet for add/edit; desktop gets a wider centered column */
:root{
  --bg:#EDF1F5; --surface:#FFFFFF; --surface-2:#F5F7FA; --ink:#0F1B26; --muted:#5A6A79; --line:#D3DBE3;
  --accent:#1450A3; --accent-ink:#FFFFFF; --kraft:#B9823A; --kraft-soft:#F3E6D2;
  --s-new:#5A6A79; --s-contact:#1F6FD1; --s-offer:#8A5CD0; --s-visit:#B9823A; --s-won:#1E8A56; --s-lost:#B23B3B;
  --danger:#B23B3B; --shadow:0 10px 30px rgba(15,27,38,.12);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1219; --surface:#141F2A; --surface-2:#1A2733; --ink:#E5ECF2; --muted:#8C9DAD; --line:#243341;
  --accent:#5B9BF0; --accent-ink:#06121F; --kraft:#D9A55C; --kraft-soft:#33291B;
  --s-new:#8C9DAD; --s-contact:#5B9BF0; --s-offer:#B08CF0; --s-visit:#D9A55C; --s-won:#4CC48A; --s-lost:#E06A6A;
  --danger:#E06A6A; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1219; --surface:#141F2A; --surface-2:#1A2733; --ink:#E5ECF2; --muted:#8C9DAD; --line:#243341;
  --accent:#5B9BF0; --accent-ink:#06121F; --kraft:#D9A55C; --kraft-soft:#33291B;
  --s-new:#8C9DAD; --s-contact:#5B9BF0; --s-offer:#B08CF0; --s-visit:#D9A55C; --s-won:#4CC48A; --s-lost:#E06A6A;
  --danger:#E06A6A; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:0 120px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 10px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1;margin:0;letter-spacing:.01em;text-wrap:balance}
.brand h1 span{color:var(--kraft)}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--s-won);box-shadow:0 0 0 0 var(--s-won);animation:ping 2.4s infinite}
.dot.local{background:var(--kraft)}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--s-won) 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.searchrow{display:flex;gap:8px;margin-top:12px}
.search{flex:1;min-width:0;position:relative}
.search input{width:100%;padding:11px 12px 11px 38px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 12px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink)}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}

/* pipeline */
.pipe{display:flex;gap:8px;overflow-x:auto;padding-block:14px 4px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.pipe::-webkit-scrollbar{display:none}
.stage{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 12px;text-align:left;min-width:92px;position:relative;overflow:hidden;transition:transform .15s,border-color .15s}
.stage::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.stage b{display:block;font-family:var(--f-display);font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.stage small{font-size:12px;color:var(--muted);white-space:nowrap}
.stage[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface))}
.stage:active{transform:scale(.97)}

.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* sections */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 8px}
.sec-h h2{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.12em;text-transform:uppercase;margin:0;color:var(--muted)}
.sec-h span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}

.lead{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;width:100%;animation:rise .35s both;animation-delay:calc(var(--i,0) * 30ms)}
@keyframes rise{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
.lead:active{background:var(--surface-2)}
.flag{width:42px;height:42px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-size:22px;position:relative}
.flag i{position:absolute;right:-3px;bottom:-3px;width:12px;height:12px;border-radius:50%;border:2px solid var(--surface);background:var(--muted)}
.flag i.hot{background:var(--danger);animation:hot 1.6s infinite}
.flag i.warm{background:var(--kraft)}
.flag i.cold{background:var(--s-contact)}
@keyframes hot{50%{transform:scale(1.25)}}
.lead-main{min-width:0}
.lead-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lead-sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.tag{font-family:var(--f-mono);font-size:11px;padding:2px 7px;border-radius:6px;background:var(--kraft-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--kraft) 40%,transparent)}
.lead-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pill{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);white-space:nowrap}
.due{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.due.late{color:var(--danger);font-weight:600}
.due.today{color:var(--kraft);font-weight:600}

.empty{border:1.5px dashed var(--line);border-radius:18px;padding:28px 20px;text-align:center;color:var(--muted)}
.empty .box{width:84px;height:62px;margin:0 auto 12px}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:22px;margin-bottom:4px}

/* FAB */
.fab{position:fixed;right:max(16px,calc(50% - 414px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--accent);color:var(--accent-ink);border:0;border-radius:18px;padding:15px 20px;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);transition:transform .15s}
.fab:active{transform:scale(.95)}
.fab svg{width:20px;height:20px;stroke:currentColor;stroke-width:2.4;fill:none}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,10,15,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:640px;margin:0 auto;background:var(--surface);border-radius:22px 22px 0 0;max-height:92%;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow)}
.sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 8px;gap:8px}
.sheet-h h3{font-family:var(--f-display);font-size:24px;margin:0;line-height:1.1}
.sheet-body{overflow-y:auto;padding:4px 16px 16px;-webkit-overflow-scrolling:touch}
.sheet-foot{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 16px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);flex:1}
.btn.danger{color:var(--danger)}
.btn.danger.arm{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.ghost{background:none;border:0;color:var(--muted);padding:8px;font-size:14px}

.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.full{grid-column:1/-1}
.f label,.lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.f input,.f select,.f textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);font-size:16px}
.f textarea{min-height:84px;resize:vertical}
.req{color:var(--danger)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 11px;font-size:14px;text-align:left}
.seg button small{display:block;font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface));box-shadow:inset 0 0 0 1px var(--accent)}
.seg.st button[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 15%,var(--surface));box-shadow:inset 0 0 0 1px var(--c)}
.quick{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.quick button{border:1px dashed var(--line);background:none;border-radius:8px;padding:4px 9px;font-size:12px;color:var(--muted)}

.log{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.log-add{display:flex;gap:8px;margin:8px 0 12px}
.log-add input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);font-size:16px}
.ev{position:relative;padding:0 0 12px 18px;border-left:2px solid var(--line);margin-left:5px}
.ev::before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--kraft)}
.ev time{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.ev p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.meta{font-size:12px;color:var(--muted);margin-top:14px}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.banner{margin-top:12px;font-size:13px;padding:10px 12px;border-radius:12px;background:var(--kraft-soft);border:1px solid color-mix(in srgb,var(--kraft) 40%,transparent)}

/* business card scan */
.scan{display:flex;gap:12px;align-items:center;border:1.5px dashed color-mix(in srgb,var(--accent) 55%,var(--line));background:color-mix(in srgb,var(--accent) 6%,var(--surface));border-radius:16px;padding:12px;margin-bottom:14px;width:100%;text-align:left;position:relative;overflow:hidden}
.scan .ico{flex:0 0 46px;height:46px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.scan .ico svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2}
.scan b{display:block;font-size:15px}
.scan small{color:var(--muted);font-size:12px}
.scan.busy::after{content:"";position:absolute;left:0;right:0;height:40%;top:-40%;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--accent) 22%,transparent),transparent);animation:sweep 1.3s linear infinite}
@keyframes sweep{to{top:100%}}
.cardimg{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
.cardimg img{width:120px;max-width:40%;border-radius:10px;border:1px solid var(--line);object-fit:cover;aspect-ratio:1.6}
.cardimg p{margin:0;font-size:13px;color:var(--muted)}
.filled{animation:flash 1.2s ease-out}
@keyframes flash{0%{background:color-mix(in srgb,var(--s-won) 30%,var(--surface-2))}100%{background:var(--surface-2)}}
.lead.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

@media (min-width:700px){.brand h1{font-size:34px}.sheet{bottom:24px;border-radius:22px;max-height:calc(100% - 48px)}}
/* tablet / iPad landscape: list left, detail docked right */
@media (min-width:980px){
  .wrap{max-width:none;margin:0;margin-right:480px;padding-inline:24px}
  header.top{margin-inline:-24px;padding-inline:24px}
  .pipe{margin-inline:-24px;padding-inline:24px}
  .sheet{left:auto;right:16px;top:calc(16px + env(safe-area-inset-top,0px));bottom:16px;width:448px;max-height:none;margin:0;border-radius:22px;transform:translateX(115%);border:1px solid var(--line)}
  .sheet .grab{display:none}
  .scrim{display:none}
  .fab{right:496px}
  .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
}
@media (max-width:420px){.form{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>ORİMAK <span>Fuar</span> CRM</h1>
      <div class="sync" id="sync"><span class="dot" id="syncDot"></span><span id="syncTxt">Bağlanıyor…</span></div>
    </div>
    <div class="searchrow">
      <div class="search">
        <svg viewBox="0 0 24 24" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="İsim, firma, ülke, not ara" autocomplete="off">
      </div>
      <button class="iconbtn" id="exportBtn" type="button" aria-label="CSV olarak dışa aktar">
        <svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>CSV
      </button>
    </div>
    <div class="pipe" id="pipe"></div>
    <div class="filters" id="modelFilters"></div>
  </header>

  <div id="banner"></div>
  <div id="dueBlock"></div>
  <div class="sec-h"><h2 id="listTitle">Tüm müşteriler</h2><span id="listCount"></span></div>
  <div class="list" id="list"></div>
</div>

<button class="fab" id="fab" type="button"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Yeni müşteri</button>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="grab"></div>
  <div class="sheet-h"><h3 id="sheetTitle">Yeni müşteri</h3><button class="ghost" id="closeBtn" type="button">Kapat</button></div>
  <div class="sheet-body">
    <button class="scan" id="scanBtn" type="button" hidden>
      <span class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><circle cx="12" cy="12.5" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg></span>
      <span><b id="scanTitle">Kartvizit tara</b><small id="scanSub">Fotoğraf çekin, bilgiler otomatik dolsun</small></span>
    </button>
    <input id="scanFile" type="file" accept="image/*" capture="environment" hidden>
    <div class="cardimg" id="cardImg" hidden></div>
    <form class="form" id="form" autocomplete="off">
      <div class="f full"><label for="f_name">Ad Soyad <span class="req">*</span></label><input id="f_name" required placeholder="Örn. Ahmed Al-Sayed"></div>
      <div class="f"><label for="f_company">Firma</label><input id="f_company" placeholder="Firma adı"></div>
      <div class="f"><label for="f_country">Ülke</label><input id="f_country" list="countries" placeholder="Ülke seçin veya yazın"></div>
      <div class="f"><label for="f_phone">Telefon / WhatsApp</label><input id="f_phone" type="tel" inputmode="tel" placeholder="+90 …"></div>
      <div class="f"><label for="f_email">E-posta</label><input id="f_email" type="email" inputmode="email" placeholder="ornek@firma.com"></div>
      <div class="f full"><span class="lbl">İlgilendiği model</span><div class="seg" id="f_models"></div></div>
      <div class="f full"><span class="lbl">İlgi seviyesi</span><div class="seg" id="f_temp"></div></div>
      <div class="f full"><span class="lbl">Durum</span><div class="seg st" id="f_status"></div></div>
      <div class="f"><label for="f_follow">Takip tarihi</label><input id="f_follow" type="date">
        <div class="quick"><button type="button" data-d="1">Yarın</button><button type="button" data-d="3">+3 gün</button><button type="button" data-d="7">+1 hafta</button><button type="button" data-d="0">Temizle</button></div></div>
      <div class="f"><label for="f_fair">Fuar / Kaynak</label><input id="f_fair" list="fairs" placeholder="Örn. Eurasia Packaging 2026"></div>
      <div class="f full"><label for="f_desc">Açıklama</label><textarea id="f_desc" placeholder="Ne istiyor, kutu ölçüleri, kapasite, bütçe, teslim beklentisi…"></textarea></div>
    </form>
    <div class="log" id="logBlock" hidden>
      <span class="lbl">Görüşme geçmişi</span>
      <div class="log-add"><input id="logInput" placeholder="Not ekle: aradım, teklif gönderdim…"><button class="btn" id="logBtn" type="button">Ekle</button></div>
      <div id="logList"></div>
      <div class="meta" id="metaLine"></div>
    </div>
  </div>
  <div class="sheet-foot">
    <button class="btn danger" id="delBtn" type="button" hidden>Sil</button>
    <button class="btn primary" id="saveBtn" type="button">Kaydet</button>
  </div>
</section>
<div class="toast" id="toast" role="status"></div>

<datalist id="countries"></datalist>
<datalist id="fairs"></datalist>

<script>
const MODELS=[["Q-BOX","80 FEFCO · CNC kesim"],["BC410 pro","≤60 kg · kapatma"],["ORİTEQ Entegre Hat","kesim + kapatma"],["Yedek parça / Servis",""],["Diğer",""]];
const STATUSES=[["new","Yeni","--s-new"],["contact","İletişimde","--s-contact"],["offer","Teklif verildi","--s-offer"],["visit","Ziyaret / Demo","--s-visit"],["won","Kazanıldı","--s-won"],["lost","Kaybedildi","--s-lost"]];
const TEMPS=[["hot","Sıcak"],["warm","Ilık"],["cold","Soğuk"]];
const COUNTRIES=[["Türkiye","TR"],["Almanya","DE"],["Azerbaycan","AZ"],["Irak","IQ"],["İran","IR"],["Suudi Arabistan","SA"],["Birleşik Arap Emirlikleri","AE"],["Katar","QA"],["Kuveyt","KW"],["Umman","OM"],["Ürdün","JO"],["Lübnan","LB"],["Mısır","EG"],["Libya","LY"],["Tunus","TN"],["Cezayir","DZ"],["Fas","MA"],["Nijerya","NG"],["Kenya","KE"],["Güney Afrika","ZA"],["Etiyopya","ET"],["Gürcistan","GE"],["Ermenistan","AM"],["Kazakistan","KZ"],["Özbekistan","UZ"],["Türkmenistan","TM"],["Kırgızistan","KG"],["Rusya","RU"],["Ukrayna","UA"],["Romanya","RO"],["Bulgaristan","BG"],["Yunanistan","GR"],["Sırbistan","RS"],["Bosna-Hersek","BA"],["Kosova","XK"],["Arnavutluk","AL"],["Kuzey Makedonya","MK"],["Macaristan","HU"],["Polonya","PL"],["Çekya","CZ"],["Avusturya","AT"],["İtalya","IT"],["Fransa","FR"],["İspanya","ES"],["Portekiz","PT"],["Hollanda","NL"],["Belçika","BE"],["Birleşik Krallık","GB"],["İsveç","SE"],["Danimarka","DK"],["Pakistan","PK"],["Hindistan","IN"],["Bangladeş","BD"],["Endonezya","ID"],["Malezya","MY"],["ABD","US"],["Kanada","CA"],["Meksika","MX"],["Brezilya","BR"],["Şili","CL"]];
const flagOf=n=>{const c=COUNTRIES.find(x=>x[0].toLocaleLowerCase("tr")===(n||"").trim().toLocaleLowerCase("tr"));if(!c)return "🌐";if(c[1]==="XK")return "🇽🇰";return String.fromCodePoint(...[...c[1]].map(ch=>127397+ch.charCodeAt(0)));};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayISO=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const fmtDate=iso=>{if(!iso)return "";const [y,m,d]=iso.split("-");return `${d}.${m}.${y}`};
const fmtTime=ms=>new Date(ms).toLocaleString("tr-TR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
const stOf=k=>STATUSES.find(s=>s[0]===k)||STATUSES[0];

$("countries").innerHTML=COUNTRIES.map(c=>`<option value="${c[0]}">`).join("");

/* ---------- state ---------- */
let leads=[], mode="wait", db=null, user=null, myId=null, canWrite=true, names={}, sampler=null, assets=null, pendingCard=null;
let fStatus=null, fModel=null, query="";
const LS="orimak_fuar_crm_v1";
const lsGet=(k,f)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

function setSync(kind,txt){$("syncDot").className="dot "+(kind||"");$("syncTxt").textContent=txt}

async function boot(){
  render();
  if(!window.claude||!window.claude.use){return useLocal()}
  try{
    const [d,u]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    db=d;user=u;
  }catch(e){db=null}
  window.claude.use("sample").then(async s=>{
    if(!s)return;const lim=await s.limits().catch(()=>null);
    if(lim&&lim.images){sampler=s;if(editing===null&&$("sheet").classList.contains("open"))$("scanBtn").hidden=!canWrite}
  }).catch(()=>{});
  window.claude.use("assets").then(a=>{assets=a}).catch(()=>{});
  if(!db)return useLocal();
  mode="db";
  if(user){try{myId=await user.id()}catch(e){}try{const w=await user.can("data.write");if(w===false)canWrite=false}catch(e){}}
  if(!canWrite){$("fab").hidden=true;$("banner").innerHTML=`<div class="banner">Bu listeyi yalnızca görüntüleyebilirsiniz. Kayıt eklemek için sahibinden düzenleme izni isteyin.</div>`}
  setSync("on","Ekip ile canlı");
  db.collection("leads").onSnapshot(snap=>{
    leads=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
    resolveNames();render();
  },err=>{setSync("","Bağlantı kesildi");toast("Bağlantı kesildi. Sayfayı yenileyin.")});
}
function useLocal(){
  mode="local";leads=lsGet(LS,[]);
  setSync("local","Bu cihazda");
  $("banner").innerHTML=`<div class="banner">Ortak liste şu an açılamadı; kayıtlar bu cihazda tutuluyor. CSV ile yedek alabilirsiniz.</div>`;
  render();
}
async function resolveNames(){
  if(!user||!user.profiles)return;
  const ids=[...new Set(leads.map(l=>l.createdBy).filter(Boolean))];
  if(!ids.length)return;
  try{const ps=await user.profiles(ids);ids.forEach(id=>{names[id]=(ps[id]&&ps[id].name)||""})}catch(e){}
}

async function persist(lead){
  const body=Object.assign({},lead);delete body.id;
  if(mode==="db"){
    try{
      if(lead.id){await db.doc("leads/"+lead.id).set(body)}
      else{const r=await db.collection("leads").add(body);lead.id=r.id}
      return true;
    }catch(e){
      if(e&&e.code==="invalid_argument"&&canWrite===true){toast("Kaydedilemedi: bu listeye yazma izniniz yok.")}
      else if(e&&e.code==="quota_exceeded"){toast("Liste dolu. Eski kayıtları silip tekrar deneyin.")}
      else toast("Kaydedilemedi. İnternet bağlantısını kontrol edip tekrar deneyin.");
      return false;
    }
  }
  if(!lead.id)lead.id="L"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const i=leads.findIndex(l=>l.id===lead.id);
  if(i>=0)leads[i]=lead;else leads.push(lead);
  lsSet(LS,leads);render();return true;
}
async function removeLead(id){
  if(mode==="db"){try{await db.doc("leads/"+id).delete()}catch(e){toast("Silinemedi. Tekrar deneyin.");return false}return true}
  leads=leads.filter(l=>l.id!==id);lsSet(LS,leads);render();return true;
}

/* ---------- render ---------- */
function isOpen(l){return l.status!=="won"&&l.status!=="lost"}
function dueClass(l){if(!l.followUp||!isOpen(l))return "";const t=todayISO();return l.followUp<t?"late":l.followUp===t?"today":""}
function matches(l){
  if(fStatus&&l.status!==fStatus)return false;
  if(fModel&&!(l.models||[]).includes(fModel))return false;
  if(query){const hay=[l.name,l.company,l.country,l.desc,l.phone,l.email,l.fair,...(l.log||[]).map(x=>x.text)].join(" ").toLocaleLowerCase("tr");if(!hay.includes(query))return false}
  return true;
}
function card(l,i){
  const st=stOf(l.status), dc=dueClass(l);
  const dueTxt=l.followUp&&isOpen(l)?(dc==="late"?"Gecikti · ":dc==="today"?"Bugün · ":"Takip · ")+fmtDate(l.followUp):"";
  return `<button class="lead${typeof editing!=="undefined"&&editing&&editing.id===l.id?" sel":""}" type="button" data-id="${esc(l.id)}" style="--i:${Math.min(i,14)}">
    <span class="flag" aria-hidden="true">${flagOf(l.country)}<i class="${esc(l.temp||"")}"></i></span>
    <span class="lead-main">
      <span class="lead-name" style="display:block">${esc(l.name)}</span>
      <span class="lead-sub" style="display:block">${esc([l.company,l.country].filter(Boolean).join(" · ")||"Firma / ülke girilmedi")}</span>
      ${(l.models||[]).length?`<span class="tags">${l.models.map(m=>`<span class="tag">${esc(m)}</span>`).join("")}</span>`:""}
    </span>
    <span class="lead-side"><span class="pill" style="--c:var(${st[2]})">${st[1]}</span>${dueTxt?`<span class="due ${dc}">${dueTxt}</span>`:""}</span>
  </button>`;
}
function render(){
  // pipeline
  const counts={};STATUSES.forEach(s=>counts[s[0]]=0);leads.forEach(l=>counts[l.status||"new"]=(counts[l.status||"new"]||0)+1);
  $("pipe").innerHTML=`<button class="stage" type="button" data-st="" aria-pressed="${!fStatus}" style="--c:var(--ink)"><b>${leads.length}</b><small>Toplam</small></button>`+
    STATUSES.map(s=>`<button class="stage" type="button" data-st="${s[0]}" aria-pressed="${fStatus===s[0]}" style="--c:var(${s[2]})"><b>${counts[s[0]]}</b><small>${s[1]}</small></button>`).join("");
  $("modelFilters").innerHTML=MODELS.filter(m=>leads.some(l=>(l.models||[]).includes(m[0]))).map(m=>`<button class="chip" type="button" data-m="${esc(m[0])}" aria-pressed="${fModel===m[0]}">${esc(m[0])}</button>`).join("");
  $("fairs").innerHTML=[...new Set(leads.map(l=>l.fair).filter(Boolean))].map(f=>`<option value="${esc(f)}">`).join("");

  // due block
  const t=todayISO();
  const due=leads.filter(l=>isOpen(l)&&l.followUp&&l.followUp<=t).sort((a,b)=>a.followUp.localeCompare(b.followUp));
  $("dueBlock").innerHTML=due.length&&!fStatus&&!fModel&&!query?`<div class="sec-h"><h2>Bugün aranacaklar</h2><span>${due.length}</span></div><div class="list">${due.map(card).join("")}</div>`:"";

  // main list
  const rows=leads.filter(matches).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  $("listTitle").textContent=fStatus?stOf(fStatus)[1]:fModel?fModel:query?"Arama sonuçları":"Tüm müşteriler";
  $("listCount").textContent=rows.length?rows.length+" kayıt":"";
  if(!leads.length){
    $("list").innerHTML=`<div class="empty">
      <svg class="box" viewBox="0 0 84 62" aria-hidden="true"><path d="M8 20 42 8l34 12v30L42 58 8 50Z" fill="var(--kraft-soft)" stroke="var(--kraft)" stroke-width="2" stroke-linejoin="round"/><path d="M8 20l34 12 34-12M42 32v26" fill="none" stroke="var(--kraft)" stroke-width="2"/><path d="M25 14l34 12" stroke="var(--kraft)" stroke-width="2" stroke-dasharray="3 3"/></svg>
      <b>${mode==="wait"?"Liste yükleniyor":"Henüz müşteri yok"}</b>
      ${mode==="wait"?"Ortak liste açılıyor…":"Standa gelen ilk ziyaretçiyi <strong>Yeni müşteri</strong> ile ekleyin. İsim, ülke, model ve açıklama yeterli."}</div>`;
  }else if(!rows.length){
    $("list").innerHTML=`<div class="empty"><b>Eşleşen kayıt yok</b>Aramayı veya filtreyi değiştirin.</div>`;
  }else $("list").innerHTML=rows.map(card).join("");
}

/* ---------- interactions ---------- */
$("q").addEventListener("input",e=>{query=e.target.value.trim().toLocaleLowerCase("tr");render()});
$("pipe").addEventListener("click",e=>{const b=e.target.closest(".stage");if(!b)return;fStatus=b.dataset.st&&fStatus!==b.dataset.st?b.dataset.st:null;render()});
$("modelFilters").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;fModel=fModel===b.dataset.m?null:b.dataset.m;render()});
document.addEventListener("click",e=>{const c=e.target.closest(".lead");if(c)openSheet(leads.find(l=>l.id===c.dataset.id))});

/* sheet */
let editing=null, selModels=[], selTemp="warm", selStatus="new", delArmed=false;
function segRender(){
  $("f_models").innerHTML=MODELS.map(m=>`<button type="button" data-v="${esc(m[0])}" aria-pressed="${selModels.includes(m[0])}">${esc(m[0])}${m[1]?`<small>${esc(m[1])}</small>`:""}</button>`).join("");
  $("f_temp").innerHTML=TEMPS.map(t=>`<button type="button" data-v="${t[0]}" aria-pressed="${selTemp===t[0]}">${t[1]}</button>`).join("");
  $("f_status").innerHTML=STATUSES.map(s=>`<button type="button" data-v="${s[0]}" aria-pressed="${selStatus===s[0]}" style="--c:var(${s[2]})">${s[1]}</button>`).join("");
}
$("f_models").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const v=b.dataset.v;selModels=selModels.includes(v)?selModels.filter(x=>x!==v):[...selModels,v];segRender()});
$("f_temp").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;selTemp=b.dataset.v;segRender()});
$("f_status").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;selStatus=b.dataset.v;segRender()});
document.querySelector(".quick").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const n=+b.dataset.d;$("f_follow").value=n?addDays(n):""});

function openSheet(l){
  editing=l?JSON.parse(JSON.stringify(l)):null;delArmed=false;
  $("sheetTitle").textContent=l?l.name:"Yeni müşteri";
  $("f_name").value=l?.name||"";$("f_company").value=l?.company||"";$("f_country").value=l?.country||"";
  $("f_phone").value=l?.phone||"";$("f_email").value=l?.email||"";$("f_follow").value=l?.followUp||"";
  $("f_fair").value=l?.fair||lsGet(LS+"_fair","");$("f_desc").value=l?.desc||"";
  selModels=[...(l?.models||[])];selTemp=l?.temp||"warm";selStatus=l?.status||"new";segRender();
  $("delBtn").hidden=!l||!canWrite;$("delBtn").classList.remove("arm");$("delBtn").textContent="Sil";
  $("saveBtn").hidden=!canWrite;
  $("logBlock").hidden=!l;
  if(l)renderLog();
  pendingCard=null;
  $("scanBtn").hidden=!(sampler&&canWrite);
  $("scanTitle").textContent=l?"Kartviziti yeniden tara":"Kartvizit tara";
  $("scanSub").textContent=l?"Boş alanları karttan doldurur":"Fotoğraf çekin, bilgiler otomatik dolsun";
  showCardImg(l&&l.cardImg?"/_blob/"+l.cardImg:"",l&&l.cardImg?"Kayıtlı kartvizit":"");
  $("scrim").classList.add("open");$("sheet").classList.add("open");
  document.querySelectorAll(".lead").forEach(c=>c.classList.toggle("sel",!!l&&c.dataset.id===l.id));
  $("sheet").querySelector(".sheet-body").scrollTop=0;
}
function closeSheet(){$("scrim").classList.remove("open");$("sheet").classList.remove("open");editing=null;pendingCard=null;document.querySelectorAll(".lead.sel").forEach(c=>c.classList.remove("sel"))}
function showCardImg(src,txt){
  const box=$("cardImg");
  if(!src){box.hidden=true;box.innerHTML="";return}
  box.hidden=false;box.innerHTML=`<img alt="Kartvizit" src="${esc(src)}"><p>${esc(txt)}</p>`;
}

/* ---------- business card scan ---------- */
function downscale(file,max=1600){
  return new Promise(res=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");
      c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);c.toBlob(b=>res(b||file),"image/jpeg",.85)};
    img.onerror=()=>{URL.revokeObjectURL(url);res(file)};img.src=url;
  });
}
$("scanBtn").addEventListener("click",()=>$("scanFile").click());
$("scanFile").addEventListener("change",async e=>{
  const file=e.target.files&&e.target.files[0];e.target.value="";
  if(!file||!sampler)return;
  const blob=await downscale(file);
  const preview=URL.createObjectURL(blob);
  showCardImg(preview,"Kart okunuyor…");
  $("scanBtn").classList.add("busy");$("scanBtn").disabled=true;$("scanSub").textContent="Okunuyor, birkaç saniye sürebilir…";
  const prompt=`Bu bir kartvizit fotoğrafı. Üzerindeki kişi ve firma bilgilerini oku.
Yalnızca şu JSON nesnesiyle cevap ver, bulamadığın alanı boş string bırak:
{"name":"","title":"","company":"","country":"","phone":"","email":"","website":"","address":""}
Kurallar: name = kişinin adı soyadı (firma adı değil). phone = birden fazla varsa önce cep/WhatsApp, uluslararası formatta (+ ile). country = ülkeyi Türkçe adıyla yaz; şu listeden biri uyuyorsa aynen onu kullan: ${COUNTRIES.map(c=>c[0]).join(", ")}. Adres veya telefon kodundan ülkeyi çıkarabilirsin. Kart Arapça, Rusça veya başka alfabedeyse isim ve firmayı Latin harfleriyle yaz.`;
  try{
    const r=await sampler.json(prompt,{images:blob});
    const v=k=>typeof r?.[k]==="string"?r[k].trim():"";
    const isNew=!editing;
    const fill=(id,val)=>{if(!val)return;const el=$(id);if(isNew||!el.value.trim()){el.value=val;el.classList.remove("filled");void el.offsetWidth;el.classList.add("filled")}};
    fill("f_name",v("name"));fill("f_company",v("company"));fill("f_country",v("country"));fill("f_phone",v("phone"));fill("f_email",v("email"));
    const extra=[v("title")&&"Ünvan: "+v("title"),v("website")&&"Web: "+v("website"),v("address")&&"Adres: "+v("address")].filter(Boolean).join("\n");
    if(extra&&!$("f_desc").value.includes(extra)){$("f_desc").value=($("f_desc").value.trim()?$("f_desc").value.trim()+"\n":"")+extra;$("f_desc").classList.add("filled")}
    if(v("name")&&isNew)$("sheetTitle").textContent=v("name");
    pendingCard=blob;
    showCardImg(preview,"Bilgiler karttan dolduruldu. Kontrol edip Kaydet'e basın.");
    toast("Kartvizit okundu");
  }catch(err){
    const c=err&&err.code;
    showCardImg(preview,c==="not_granted"?"Kart okuma için izin verilmedi.":c==="rate_limited"?"Kullanım limiti doldu, biraz sonra tekrar deneyin.":c==="image_rejected"?"Fotoğraf okunamadı, daha net bir fotoğraf çekin.":"Kart okunamadı. Tekrar deneyin veya elle girin.");
    if(c==="not_granted"||c==="sampling_disabled"||c==="images_unavailable"){sampler=null;$("scanBtn").hidden=true}
  }finally{
    $("scanBtn").classList.remove("busy");$("scanBtn").disabled=false;
    $("scanSub").textContent=editing?"Boş alanları karttan doldurur":"Fotoğraf çekin, bilgiler otomatik dolsun";
  }
});
function renderLog(){
  const log=(editing.log||[]).slice().sort((a,b)=>b.at-a.at);
  $("logList").innerHTML=log.length?log.map(x=>`<div class="ev"><time>${fmtTime(x.at)}${x.by&&names[x.by]?" · "+esc(names[x.by]):""}</time><p>${esc(x.text)}</p></div>`).join(""):`<div class="due">Henüz not yok.</div>`;
  const who=editing.createdBy&&names[editing.createdBy]?" · Ekleyen: "+names[editing.createdBy]:"";
  $("metaLine").textContent=(editing.createdAt?"Kayıt: "+fmtTime(editing.createdAt):"")+who+(editing.updatedAt?" · Son güncelleme: "+fmtTime(editing.updatedAt):"");
}
function collect(){
  const now=Date.now();
  const base=editing||{createdAt:now,createdBy:myId||null,log:[]};
  return Object.assign({},base,{
    name:$("f_name").value.trim(),company:$("f_company").value.trim(),country:$("f_country").value.trim(),
    phone:$("f_phone").value.trim(),email:$("f_email").value.trim(),models:selModels,temp:selTemp,status:selStatus,
    followUp:$("f_follow").value||"",fair:$("f_fair").value.trim(),desc:$("f_desc").value.trim(),updatedAt:now
  });
}
$("saveBtn").addEventListener("click",async()=>{
  if(!$("f_name").value.trim()){$("f_name").focus();toast("Ad Soyad gerekli.");return}
  const lead=collect();const wasNew=!editing;
  if(lead.fair)lsSet(LS+"_fair",lead.fair);
  $("saveBtn").disabled=true;
  if(pendingCard&&assets&&mode==="db"){
    try{const up=await assets.upload(pendingCard);lead.cardImg=up.id}catch(e){toast("Kart fotoğrafı saklanamadı; bilgiler kaydediliyor.")}
  }
  const ok=await persist(lead);
  $("saveBtn").disabled=false;
  if(ok){closeSheet();toast(wasNew?"Müşteri eklendi":"Kaydedildi")}
});
$("logBtn").addEventListener("click",async()=>{
  const v=$("logInput").value.trim();if(!v||!editing)return;
  const lead=collect();lead.log=[...(editing.log||[]),{at:Date.now(),text:v,by:myId||null}];
  if(await persist(lead)){editing=lead;$("logInput").value="";renderLog();toast("Not eklendi")}
});
$("logInput").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();$("logBtn").click()}});
$("delBtn").addEventListener("click",async()=>{
  if(!delArmed){delArmed=true;$("delBtn").classList.add("arm");$("delBtn").textContent="Emin misiniz? Sil";return}
  if(await removeLead(editing.id)){closeSheet();toast("Silindi")}
});
$("fab").addEventListener("click",()=>openSheet(null));
$("closeBtn").addEventListener("click",closeSheet);
$("scrim").addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});

/* export */
$("exportBtn").addEventListener("click",async()=>{
  if(!leads.length){toast("Dışa aktarılacak kayıt yok.");return}
  const head=["Ad Soyad","Firma","Ülke","Telefon","E-posta","Modeller","İlgi","Durum","Takip tarihi","Fuar","Açıklama","Notlar","Kayıt tarihi"];
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const rows=leads.map(l=>[l.name,l.company,l.country,l.phone,l.email,(l.models||[]).join(", "),(TEMPS.find(t=>t[0]===l.temp)||["",""])[1],stOf(l.status)[1],fmtDate(l.followUp),l.fair,l.desc,(l.log||[]).map(x=>fmtTime(x.at)+": "+x.text).join(" | "),l.createdAt?fmtTime(l.createdAt):""].map(q).join(";"));
  const csv="﻿"+[head.map(q).join(";"),...rows].join("\r\n");
  const name=`orimak_fuar_musteriler_${todayISO()}.csv`;
  let dl=null;try{dl=window.claude&&await window.claude.use("downloads")}catch(e){}
  if(dl){try{await dl.save({filename:name,data:csv});toast("CSV hazır")}catch(e){if(e&&e.code!=="declined")toast("Dosya kaydedilemedi.")}return}
  try{await navigator.clipboard.writeText(csv);toast("CSV panoya kopyalandı")}catch(e){toast("Dışa aktarma bu görünümde açık değil.")}
});

let tt;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2200)}

boot();
</script>
