<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ORİMAK Teklif</title>
<meta name="theme-color" content="#1450A3">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#E9EDF2;--ink:#0F1B26;--muted:#5A6A79;--accent:#1450A3;--line:#D3DBE3}
@media (prefers-color-scheme:dark){:root{--bg:#0B1219;--ink:#E5ECF2;--muted:#8C9DAD;--line:#243341;color-scheme:dark}}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.bar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;background:var(--accent);color:#fff}
.bar b{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:24px;letter-spacing:.02em}
.bar button{border:0;border-radius:12px;padding:12px 16px;min-height:44px;font:inherit;font-weight:600;background:#fff;color:#1450A3;cursor:pointer;display:flex;gap:8px;align-items:center}
.bar button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.bar button:disabled{opacity:.6}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.pv{background:#fff;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);overflow:hidden;position:relative}
.pv>div{transform-origin:0 0;position:absolute;left:0;top:0;width:794px}
.msg{text-align:center;padding:60px 16px;color:var(--muted)}
.msg b{display:block;color:var(--ink);font-size:20px;margin-bottom:6px}
</style>
</head>
<body>
<div class="bar"><b>ORİMAK</b><button id="dl" type="button" disabled><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span id="dlT">PDF</span></button></div>
<div class="wrap"><div id="out"><div class="msg"><b>Yükleniyor… / Loading…</b></div></div></div>
<script src="teklif-sablon.js"></script>
<script type="module">
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDz9G-AO7iOlLkBSQJqYHQ_9bnV5RYvMto",
  authDomain: "orimak-fuar-crm.firebaseapp.com",
  projectId: "orimak-fuar-crm",
  storageBucket: "orimak-fuar-crm.firebasestorage.app",
  messagingSenderId: "614490123963",
  appId: "1:614490123963:web:9be0889fc69272c0e5439e"
};
const id=new URLSearchParams(location.search).get("id");
const out=document.getElementById("out"),dl=document.getElementById("dl");
let offer=null,blob=null;
function msg(t,s){out.innerHTML=`<div class="msg"><b>${t}</b>${s||""}</div>`}
function fit(){
  const pv=document.querySelector(".pv");if(!pv)return;const w=pv.clientWidth;const k=w/794;
  pv.firstElementChild.style.transform=`scale(${k})`;pv.style.height=Math.ceil(Math.max(pv.firstElementChild.firstElementChild.offsetHeight,1123)*k)+"px";
}
addEventListener("resize",fit);
(async()=>{
  if(!id)return msg("Teklif bulunamadı","Quotation not found.");
  try{
    const base="https://www.gstatic.com/firebasejs/10.12.2/";
    const [A,F]=await Promise.all([import(base+"firebase-app.js"),import(base+"firebase-firestore.js")]);
    const db=F.getFirestore(A.initializeApp(FIREBASE_CONFIG));
    const snap=await F.getDoc(F.doc(db,"fuar_teklif",id));
    if(!snap.exists())return msg("Teklif henüz hazır değil","Quotation not available yet. Please try again in a few minutes.");
    offer=snap.data();
  }catch(e){console.error(e);return msg("Teklif açılamadı","Could not load the quotation. Please check your connection.")}
  document.documentElement.lang=offer.lang||"tr";
  document.title=(offer.lang==="en"?"ORİMAK Quotation ":"ORİMAK Teklif ")+(offer.no||"");
  document.getElementById("dlT").textContent=offer.lang==="en"?"Download PDF":"PDF indir";
  out.innerHTML=`<div class="pv"><div>${Teklif.html(offer)}</div></div>`;fit();
  if(document.fonts)document.fonts.ready.then(fit);
  dl.disabled=false;
})();
dl.addEventListener("click",async()=>{
  if(!offer)return;const t=document.getElementById("dlT");const name=(offer.no||"teklif")+".pdf";
  if(!blob){dl.disabled=true;t.textContent=offer.lang==="en"?"Preparing…":"Hazırlanıyor…";
    try{blob=await Teklif.pdf(offer)}catch(e){t.textContent=offer.lang==="en"?"Try again":"Tekrar deneyin";dl.disabled=false;return}
    dl.disabled=false;t.textContent=offer.lang==="en"?"Download PDF":"PDF indir";}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
});
</script>
</body>
</html>
